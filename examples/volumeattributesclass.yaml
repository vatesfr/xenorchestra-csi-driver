# VolumeAttributesClass: migrate-to-slow-sr
# Apply this to a PVC with:
#   kubectl annotate pvc <pvc-name> volumeattributesclass.storage.k8s.io=migrate-to-slow-sr
---
apiVersion: storage.k8s.io/v1
kind: VolumeAttributesClass
metadata:
  name: migrate-to-slow-sr
driverName: csi.xenorchestra.vates.tech
parameters:
  # Replace with the UUID of the target Storage Repository (SR).
  # The target SR must be in the same Xen Orchestra pool as the current VDI.
  storageRepositoryId: "<slow-sr-uuid>"
