name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Publish image and Helm chart
    timeout-minutes: 25
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$tag" =~ $semver ]]; then
            echo "Invalid release tag: $tag"
            exit 1
          fi

          # Release commits must belong to the main branch.
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

          app_version="$(sed -n 's/^appVersion: //p' charts/xenorchestra-csi-driver/Chart.yaml)"
          if [ -z "$app_version" ]; then
            echo "No appVersion found in charts/xenorchestra-csi-driver/Chart.yaml"
            exit 1
          fi

          # Chart-only tags are <app version>-N (e.g. v1.0.0-1 or v1.0.0-rc.1-2):
          # the base must equal the chart's appVersion. Tags shaped like an app
          # prerelease vX.Y.Z-<word>.<number> (e.g. v1.0.0-rc.1) are app releases.
          if [[ "$tag" =~ ^v.+-[1-9][0-9]*$ ]] \
            && [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z]+\.[0-9]+$ ]] \
            && [[ "${tag%-*}" == "$app_version" ]]; then
            echo "CHART_ONLY=true" >> "$GITHUB_ENV"
            expected_app_version="${tag%-*}"
          else
            echo "CHART_ONLY=false" >> "$GITHUB_ENV"
            expected_app_version="$tag"
          fi

          if [ "$app_version" != "$expected_app_version" ]; then
            echo "Chart appVersion ($app_version) must match the application version ($expected_app_version)"
            exit 1
          fi

          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Install Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.13.3

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Github registry login
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: env.CHART_ONLY != 'true'
        timeout-minutes: 10
        run: make images
        env:
          PUSH: "true"
          TAG: ${{ env.APP_VERSION }}
          VERSION: ${{ env.APP_VERSION }}
      - name: Sign image
        if: env.CHART_ONLY != 'true'
        timeout-minutes: 4
        run: make images-cosign
        env:
          TAG: ${{ env.APP_VERSION }}

      - name: Publish and sign Helm chart
        timeout-minutes: 5
        run: make helm-login helm-release
        env:
          HELM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
