version: v2beta1
name: tmp-xo-csi-git

vars:
  VDI_NAME_PREFIX:
    source: env
    default: 'dev-csi-'

# This is a list of `pipelines` that DevSpace can execute (you can define your own)
pipelines:
  # This is the pipeline for the main command: `devspace dev` (or `devspace run-pipeline dev`)
  dev:
    run: |-
      # run_dependencies --all       # 1. Deploy any projects this project needs (see "dependencies")
      # ensure_pull_secrets --all    # 2. Ensure pull secrets
      create_deployments node     # 3. Deploy Helm charts and manifests specfied as "deployments"
      start_dev node               # 4. Start dev mode "node" (see "dev" section)
      # Open VSCode as soon as we are done
      # code --folder-uri vscode-remote://ssh-remote+node.devspace/app
  dev-controller:
    run: |-
      create_deployments controller
      start_dev controller

# This is a list of `images` that DevSpace can build for this project
# We recommend to skip image building during development (devspace dev) as much as possible
images:
  csi:
    image: ghcr.io/vatesfr/xenorchestra-csi-driver
    dockerfile: ./Dockerfile

# Dev deployments live in hack/dev/ and run on top of an existing driver
# installation (Helm or docs/deploy/csi-driver*.yml), which provides the
# CSIDriver object and the other component:
#   node        -> a static single-node Deployment manifest (hack/dev/
#                  csi-xenorchestra-node-single.yaml). It must be a Deployment,
#                  not a DaemonSet: DevSpace's start_dev can only adopt
#                  Deployments/StatefulSets/ReplicaSets.
#   controller  -> the Helm chart rendered with hack/dev/values-controller.yaml
# The release namespace is not a per-deployment field in DevSpace — select it
# once with `devspace use namespace kube-system` (or pass -n/--namespace).
deployments:
  node:
    kubectl:
      manifests:
        - hack/dev/csi-xenorchestra-node-single.yaml
  controller:
    helm:
      chart:
        path: ./charts/xenorchestra-csi-driver
      releaseName: csi-xenorchestra-dev-controller
      valuesFiles:
        - hack/dev/values-controller.yaml

# This is a list of `dev` containers that are based on the containers created by your deployments
dev:
  node:
    # Search for the container that runs this image
    # imageSelector: ghcr.io/vatesfr/xenorchestra-csi-driver
    # # Search for pods with this label selector
    # `name: xenorchestra-csi-driver-single` pins the selector to the dev
    # Deployment's pod: the base install's node DaemonSet uses the same
    # `component`/`instance` labels but not this `name`.
    labelSelector:
      app.kubernetes.io/component: node
      app.kubernetes.io/instance: xenorchestra-csi-driver
      app.kubernetes.io/name: xenorchestra-csi-driver-single
    # Specify the namespace where the pod is deployed
    namespace: kube-system
    # Specify which container to target when multiple containers are found
    container: xenorchestra-csi-driver
    # Replace the container image with this dev-optimized image (allows to skip image building during development)
    devImage: golang:1.26.8-trixie
    workingDir: /app
    # Remove security context to run as root
    # patches:
    #   - op: remove
    #     path: spec.securityContext
    # Sync files between the local filesystem and the development container
    sync:
      - path: ./bin/:/app/bin
      - path: ./:/app
        uploadExcludeFile: .dockerignore
        # - path: "${DEVSPACE_USER_HOME}/.gitconfig:/root/.gitconfig"
        #   file: true
        #   disableDownload: true
    # Open a terminal and use the following command to start it
    terminal:
      # command: ./devspace_start.sh
      command: "bash"
    # Inject a lightweight SSH server into the dev container (so your IDE can connect to the remote dev env)
    ssh:
      enabled: true
      localHostname: node.devspace
    # Make the following commands from my local machine available inside the dev container
    proxyCommands:
      - command: devspace
      - command: kubectl
      - command: helm
      - gitCredentials: true
    # Forward the following ports to be able access your application via localhost
    env:
      - name: VDI_NAME_PREFIX
        value: "${VDI_NAME_PREFIX}"
    ports:
      - port: "2345"

  controller:
    # `instance` pins the selector to the dev release's pod (the base install
    # runs its own controller with the same `component` label).
    labelSelector:
      app.kubernetes.io/component: controller
      app.kubernetes.io/instance: csi-xenorchestra-dev-controller
    namespace: kube-system
    container: xenorchestra-csi-driver
    devImage: golang:1.26.8-trixie
    workingDir: /app
    sync:
      # - path: ./bin/:/app/bin
      - path: ./:/app
        uploadExcludeFile: .dockerignore
    terminal:
      command: ./devspace_start.sh
    ssh:
      enabled: true
      localHostname: controller.devspace
    proxyCommands:
      - command: devspace
      - command: kubectl
      - command: helm
      - gitCredentials: true
    env:
      - name: VDI_NAME_PREFIX
        value: "${VDI_NAME_PREFIX}"
    ports:
      - port: "2345"
# Use the `commands` section to define repeatable dev workflows for this project
commands:
  dev-controller:
    command: |-
      devspace run-pipeline dev-controller

hooks:
  - name: "install required packages"
    container:
      imageSelector: golang:1.26.8-trixie
      once: true
    command: "go install github.com/go-delve/delve/cmd/dlv@latest"
    events: [ "devCommand:before:sync" ]

# Define dependencies to other projects with a devspace.yaml
# dependencies:
#   api:
#     git: https://...  # Git-based dependencies
#     tag: v1.0.0
#   ui:
#     path: ./ui        # Path-based dependencies (for monorepos)
