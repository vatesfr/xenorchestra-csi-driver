{{- if .Values.tests.enabled }}
{{- $storageClassName := required "tests.storageClassName is required when tests.enabled=true" .Values.tests.storageClassName }}
{{- $image := .Values.tests.image | default dict }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "xenorchestra-csi-driver.fullname" . }}-test
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "xenorchestra-csi-driver.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: volume-test
      image: "{{ $image.repository | default "busybox" }}:{{ $image.tag | default "1.37.0" }}"
      imagePullPolicy: {{ $image.pullPolicy | default "IfNotPresent" }}
      command:
        - /bin/sh
        - -ec
        - |
          expected="xenorchestra-csi-driver helm test"
          printf '%s\n' "$expected" > /data/result
          actual="$(cat /data/result)"
          test "$actual" = "$expected"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: test-volume
          mountPath: /data
  {{- with .Values.tests.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.tests.affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.tests.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  volumes:
    - name: test-volume
      ephemeral:
        volumeClaimTemplate:
          metadata:
            labels:
              {{- include "xenorchestra-csi-driver.labels" . | nindent 14 }}
              app.kubernetes.io/component: test
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: {{ $storageClassName | quote }}
            resources:
              requests:
                storage: {{ .Values.tests.size | default "1Gi" }}
{{- end }}
