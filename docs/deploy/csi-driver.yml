# Source: xenorchestra-csi-driver/templates/node.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: xenorchestra-csi-driver-node
  namespace: kube-system
  labels:
    helm.sh/chart: xenorchestra-csi-driver-0.4.0
    app.kubernetes.io/name: xenorchestra-csi-driver
    app.kubernetes.io/instance: xenorchestra-csi-driver
    app.kubernetes.io/version: "v0.4.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: xenorchestra-csi-driver
    app.kubernetes.io/component: node
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: xenorchestra-csi-driver
      app.kubernetes.io/instance: xenorchestra-csi-driver
      app.kubernetes.io/component: node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xenorchestra-csi-driver
        app.kubernetes.io/instance: xenorchestra-csi-driver
        app.kubernetes.io/component: node
    spec:
      enableServiceLinks: false
      serviceAccountName: xenorchestra-csi-driver-node
      hostNetwork: false
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      containers:
        - name: liveness-probe
          image: "registry.k8s.io/sig-storage/livenessprobe:v2.18.0"
          imagePullPolicy: IfNotPresent
          args:
            - --csi-address=/csi/csi.sock
            - --http-endpoint=:29603
            - --v=2
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          resources:
            limits:
              memory: 100Mi
            requests:
              cpu: 10m
              memory: 20Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        - name: node-driver-registrar
          image: "registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.16.0"
          imagePullPolicy: IfNotPresent
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/csi.xenorchestra.vates.tech/csi.sock
            - --v=2
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
          resources:
            limits:
              memory: 100Mi
            requests:
              cpu: 10m
              memory: 20Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        - name: xenorchestra-csi-driver
          image: "ghcr.io/vatesfr/xenorchestra-csi-driver:v0.4.0"
          imagePullPolicy: IfNotPresent
          args:
            - --v=2
            - --mode=node
            - --endpoint=unix:///csi/csi.sock
            - --node-name=$(KUBE_NODE_NAME)
          env:
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: healthz
              containerPort: 29603
            - name: metrics
              containerPort: 29605
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /healthz
              port: healthz
          securityContext:
            privileged: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: mountpoint-dir
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
            - name: device-dir
              mountPath: /dev
          resources:
            limits:
              memory: 1000Mi
            requests:
              cpu: 10m
              memory: 20Mi
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
      volumes:
        - name: socket-dir
          hostPath:
            path: /var/lib/kubelet/plugins/csi.xenorchestra.vates.tech
            type: DirectoryOrCreate
        - name: mountpoint-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: DirectoryOrCreate
        - name: device-dir
          hostPath:
            path: /dev
            type: Directory

