# Source: xenorchestra-csi-driver/templates/controller.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xenorchestra-csi-driver-controller
  namespace: kube-system
  labels:
    helm.sh/chart: xenorchestra-csi-driver-0.4.0
    app.kubernetes.io/name: xenorchestra-csi-driver
    app.kubernetes.io/instance: xenorchestra-csi-driver
    app.kubernetes.io/version: "v0.4.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: xenorchestra-csi-driver
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: xenorchestra-csi-driver
      app.kubernetes.io/instance: xenorchestra-csi-driver
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xenorchestra-csi-driver
        app.kubernetes.io/instance: xenorchestra-csi-driver
        app.kubernetes.io/component: controller
      annotations:
    spec:
      enableServiceLinks: false
      serviceAccountName: xenorchestra-csi-driver-controller
      hostNetwork: false
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-cluster-critical
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: liveness-probe
          image: "registry.k8s.io/sig-storage/livenessprobe:v2.18.0"
          imagePullPolicy: IfNotPresent
          args:
            - --csi-address=/csi/csi.sock
            - --http-endpoint=:29602
            - --v=2
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          resources:
            limits:
              memory: 100Mi
            requests:
              cpu: 10m
              memory: 20Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        - name: xenorchestra-csi-driver
          image: "ghcr.io/vatesfr/xenorchestra-csi-driver:v0.4.0"
          imagePullPolicy: IfNotPresent
          args:
            - --v=2
            - --mode=controller
            - --endpoint=unix:///csi/csi.sock
            - --node-name=$(KUBE_NODE_NAME)
            - --config-file=/etc/xenorchestra/config.yaml
            - --vdi-name-prefix=csi-
            - --xo-client-timeout=30s
            - --cluster-tag=k8s-managed
            - --kubernetes-pool-tag=k8s-pool
          env:
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: healthz
              containerPort: 29602
            - name: metrics
              containerPort: 29604
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: xo-cloud-config
              mountPath: /etc/xenorchestra
              readOnly: true
          resources:
            limits:
              memory: 500Mi
            requests:
              cpu: 10m
              memory: 20Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        - name: csi-attacher
          image: "registry.k8s.io/sig-storage/csi-attacher:v4.11.0"
          imagePullPolicy: IfNotPresent
          args:
            - --v=2
            - --csi-address=/csi/csi.sock
            - --http-endpoint=:29605
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          livenessProbe:
            httpGet:
              path: /metrics
              port: 29605
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            limits:
              memory: 100Mi
            requests:
              cpu: 10m
              memory: 20Mi
        - name: csi-provisioner
          image: "registry.k8s.io/sig-storage/csi-provisioner:v6.2.0"
          imagePullPolicy: IfNotPresent
          args:
            - --v=2
            - --csi-address=/csi/csi.sock
            - --http-endpoint=:29606
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          livenessProbe:
            httpGet:
              path: /metrics
              port: 29606
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            limits:
              memory: 100Mi
            requests:
              cpu: 10m
              memory: 20Mi
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/master
          operator: Exists
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
        - effect: NoSchedule
          key: CriticalAddonsOnly
          operator: Exists
      volumes:
        - name: socket-dir
          emptyDir: {}
        - name: xo-cloud-config
          secret:
            secretName: xenorchestra-csi-driver
            items:
              - key: config.yaml
                path: config.yaml
            defaultMode: 416

